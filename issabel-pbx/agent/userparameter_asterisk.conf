# --- EXTENSIONES: TOTALES ---
UserParameter=asterisk.extensions_total,asterisk -rx "database show AMPUSER" | grep "/cidname" | wc -l | tr -d ' '
UserParameter=asterisk.extensions_pjsip_total,asterisk -rx "pjsip show endpoints" | grep -E "^ +Endpoint:\s+[0-9]+" | wc -l | tr -d ' '
UserParameter=asterisk.extensions_sip_total,asterisk -rx "sip show peers" | grep -v trunk | grep -E "^[0-9]+" | wc -l | tr -d ' '
UserParameter=asterisk.extensions_custom_total,asterisk -rx "sccp show devices" | grep -v "Devices" | grep -v "Descr" | grep -v "\+--" | grep -E ".[a-zA-Z0-9]." | wc -l | tr -d ' '

# --- EXTENSIONES: ESTADOS ONLINE / OFFLINE ---
UserParameter=asterisk.extensions_online,expr $(asterisk -rx "pjsip show endpoints" | grep -E "^ +Endpoint:\s+[0-9]+" | grep -E "Available|Not in use|In use" | wc -l) + $(asterisk -rx "sip show peers" | grep -v trunk | grep -E "^[0-9]+" | grep -E "OK \(" | wc -l) + $(asterisk -rx "sccp show devices" | grep -E "\s+OK\s+" | wc -l) | tr -d ' '
UserParameter=asterisk.extensions_offline,expr $(asterisk -rx "pjsip show endpoints" | grep -E "^ +Endpoint:\s+[0-9]+" | grep -E "Unavailable|Unknown" | wc -l) + $(asterisk -rx "sip show peers" | grep -v trunk | grep -E "^[0-9]+" | grep -E "UNKNOWN|UNREACHABLE" | wc -l) + $(asterisk -rx "sccp show devices" | grep -v "Devices" | grep -v "Descr" | grep -v "\+--" | grep -v "OK" | grep -E ".[a-zA-Z0-9]." | wc -l) | tr -d ' '
UserParameter=asterisk.extensions_pjsip_online,asterisk -rx "pjsip show endpoints" | grep -E "^ +Endpoint:\s+[0-9]+" | grep -E "Available|Not in use|In use" | wc -l | tr -d ' '
UserParameter=asterisk.extensions_pjsip_offline,asterisk -rx "pjsip show endpoints" | grep -E "^ +Endpoint:\s+[0-9]+" | grep -E "Unavailable|Unknown" | wc -l | tr -d ' '
UserParameter=asterisk.extensions_sip_online,asterisk -rx "sip show peers" | awk '$1 ~ /^[0-9]+$/ && $2 != "sip" {print $1}' | grep -E "OK \(" | wc -l | tr -d ' '
UserParameter=asterisk.extensions_sip_offline,asterisk -rx "sip show peers" | grep -v trunk | grep -E "^[0-9]+" | grep -E "UNKNOWN" | wc -l | tr -d ' '

# --- MONITOREO EXCLUSIVO SCCP Y LLAMADAS ---
UserParameter=asterisk.extensions_sccp_online,asterisk -rx "sccp show devices" | grep -E "\s+OK\s+" | wc -l | tr -d ' '
UserParameter=asterisk.active_calls,asterisk -rx "core show channels" | grep "active call" | awk '{print $1}' | tr -d ' '

# --- TRUNKS ---
UserParameter=asterisk.trunks_total,asterisk -rx "sip show peers" | grep -E "^[A-Za-z_]+" | grep -v "Name/username"  | wc -l | tr -d ' '
UserParameter=asterisk.trunks_online,asterisk -rx "sip show peers" | grep -E "^[A-Za-z_]+" | grep -v "Name/username"  |grep -E "OK" | wc -l | tr -d ' '
UserParameter=asterisk.trunks_offline,asterisk -rx "sip show peers" | grep -E "UNREACHABLE" | wc -l | tr -d ' '

# --- PROCESOS Y SISTEMA ---
UserParameter=asterisk.uptime,asterisk -rx "core show uptime seconds" | grep -i "System uptime:" | awk '{print $3}'
UserParameter=asterisk.lastreload,asterisk -rx "core show uptime seconds" | grep -i "Last reload:" | awk '{print $3}'
UserParameter=asterisk.version,asterisk -rx "core show version" | awk '{print $2}'
UserParameter=asterisk.asterisk_running,pgrep -c "^asterisk$"
UserParameter=asterisk.zabbix_running,pgrep -c "zabbix_(agentd|agent2)"