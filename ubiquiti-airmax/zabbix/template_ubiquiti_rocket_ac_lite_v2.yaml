          type: SNMP_AGENT
          snmp_oid: 1.2.840.10036.3.1.2.1.3.9
          key: ubntDeviceModel
          delay: 1d
          value_type: TEXT
          trends: '0'
          description: 'Device Model'
          inventory_link: MODEL
          tags:
            - tag: component
              value: system
        - uuid: bc1b2a9fb58f44d7ac4b9885a87dae7e
          name: 'Firmware Version'
          type: SNMP_AGENT
          snmp_oid: .1.2.840.10036.3.1.2.1.4.9
          key: ubntFirmware
          delay: 1d
          history: 90d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '\.v([0-9]+\.[0-9]+\.[0-9]+)'
                - v\1
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
