zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a47e4b4a08b2481a80f0db79d008d981
      name: Templates/Ubiquiti
  templates:
    - uuid: 842c95c8bf2e43c899e78d258104d62f
      template: 'Ubiquiti Power Beam AC - ISO V2'
      name: 'Ubiquiti Power Beam AC - ISO V2'
      vendor:
        name: jesleiman
        version: 1.0-1
      templates:
        - name: 'Generic by SNMP'
        - name: 'Ubiquiti Airmax 8.0'
        - name: 'Ubiquiti GEO'
      groups:
        - name: Templates/Ubiquiti
      items:
        - uuid: e7152c0cc48e4075a8f9913e3206908d
          name: 'Lan Eth0 enabled'
          type: SNMP_AGENT
          snmp_oid: 'IF-MIB::ifAdminStatus.4'
          key: ifAdminStatus.4
          delay: 5m
          history: 90d
          valuemap:
            name: status
          tags:
            - tag: Application
              value: Interfaces
        - uuid: 65b6219d46ff450b824dfea9e9fff3bb
          name: 'Lan Eth1 enabled'
          type: SNMP_AGENT
          snmp_oid: 'IF-MIB::ifAdminStatus.5'
          key: ifAdminStatus.5
          delay: 5m
          history: 90d
          valuemap:
            name: status
          tags:
            - tag: Application
              value: Interfaces
        - uuid: ea9b651d2cb44685acfbf40a05eec86e
          name: 'Wireless ath0 enabled'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.2.2.1.7.10
          key: ifAdminStatus.10
          history: 90d
          valuemap:
            name: status
          tags:
            - tag: Application
              value: 'Wifi Status'
        - uuid: 0cd3739b1d5d4a7abc33ed999a9b1649
          name: 'Traffic In eth0'
          type: SNMP_AGENT
          snmp_oid: 'IF-MIB::ifInOctets.4'
          key: ifInOctets.4
          history: 90d
          units: bps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: Application
              value: Interfaces
        - uuid: 4b356708262a44f5b0e584dccdb7f1c5
          name: 'Traffic In eth1'
          type: SNMP_AGENT
          snmp_oid: 'IF-MIB::ifInOctets.5'
          key: ifInOctets.5
          history: 90d
          units: bps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: Application
              value: Interfaces
        - uuid: e75169434b0140ceb52002aacd29ac47
          name: 'Traffic In ath0 (wireless)'
          type: SNMP_AGENT
          snmp_oid: 'IF-MIB::ifInOctets.10'
          key: ifInOctets.10
          history: 90d
          units: bps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: Application
              value: Interfaces
        - uuid: bf5678a00899424f956d284e77cbe1df
          name: 'Lan Eth0 link up'
          type: SNMP_AGENT
          snmp_oid: 'IF-MIB::ifOperStatus.4'
          key: ifOperStatus.4
          history: 90d
          valuemap:
            name: statusoper
          tags:
            - tag: Application
              value: Interfaces
        - uuid: 03982b8cf85b442ca0136ce98ca47d1c
          name: 'Lan Eth1 link up'
          type: SNMP_AGENT
          snmp_oid: 'IF-MIB::ifOperStatus.5'
          key: ifOperStatus.5
          history: 90d
          valuemap:
            name: statusoper
          tags:
            - tag: Application
              value: Interfaces
        - uuid: b2b72d7540f746158df53752eb5c8bde
          name: 'Wireless ath0 link up'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.2.2.1.8.10
          key: ifOperStatus.10
          history: 90d
          valuemap:
            name: statusoper
          tags:
            - tag: Application
              value: 'Wifi Status'
        - uuid: 44cb0ddd37f6474680d3f11497fe6501
          name: 'Traffic Out eth0'
          type: SNMP_AGENT
          snmp_oid: 'IF-MIB::ifOutOctets.4'
          key: ifOutOctets.4
          history: 90d
          units: bps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: Application
              value: Interfaces
        - uuid: 76dbd2cb3fe2437d9fe9739593fe8356
          name: 'Traffic Out eth1'
          type: SNMP_AGENT
          snmp_oid: 'IF-MIB::ifOutOctets.5'
          key: ifOutOctets.5
          history: 90d
          units: bps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: Application
              value: Interfaces
        - uuid: 44b2b5013eca472982302ea27671d6b4
          name: 'Traffic Out ath0 (wireless)'
          type: SNMP_AGENT
          snmp_oid: 'IF-MIB::ifOutOctets.10'
          key: ifOutOctets.10
          history: 90d
          units: bps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: Application
              value: Interfaces
        - uuid: 9645ce6919ff476483ca7e411b803a44
          name: 'CPU Utilization'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.41112.1.4.8.3.0
          key: ubnt.cpu.usage
          delay: 5m
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: cpu
        - uuid: c4ac86e50109475aa6e64c096cffa10e
          name: 'Free memory'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.10002.1.1.1.1.2.0
          key: ubnt.mem.free
          delay: 5m
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 022ae9e2578f4f87ae0d0c69bcbb19ee
          name: 'Total memory'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.10002.1.1.1.1.1.0
          key: ubnt.mem.total
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 0a958645c5d34039a210f2c3c23136f8
          name: 'Memory utilization'
          type: CALCULATED
          key: ubnt.mem.used.pcent
          delay: 5m
          trends: '0'
          units: '%'
          params: '(last(//ubnt.mem.total) - last(//ubnt.mem.free)) / last(//ubnt.mem.total) * 100'
          tags:
            - tag: component
              value: memory
        - uuid: 62e539c70737442599dab3c390c7f964
          name: 'Firmware Version'
          type: SNMP_AGENT
          snmp_oid: 1.2.840.10036.3.1.2.1.4.7
          key: ubntFirmware
          delay: 1d
          history: 30d
          value_type: TEXT
          trends: '0'
          inventory_link: SOFTWARE
          preprocessing:
            - type: REGEX
              parameters:
                - 'v([0-9]+\.[0-9]+\.[0-9]+)'
                - v\1
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 868a4d77913545358938f3a75b5ad886
          name: 'Station Kernel'
          type: SNMP_AGENT
          snmp_oid: iso.3.6.1.2.1.1.1.0
          key: ubntKernel
          delay: 1d
          value_type: TEXT
          trends: '0'
          tags:
            - tag: component
              value: system
        - uuid: 9aa7773c716c4f8e98ea9b7d659fb8c0
          name: 'Hardware model'
          type: SNMP_AGENT
          snmp_oid: 1.2.840.10036.3.1.2.1.3.7
          key: ubntModel
          delay: 1d
          value_type: TEXT
          trends: '0'
          description: 'Device Model'
          inventory_link: MODEL
          tags:
            - tag: component
              value: system
        - uuid: fb29ef47d0534aa3b9f0d9c93327c164
          name: 'Station Vendor'
          type: SNMP_AGENT
          snmp_oid: iso.2.840.10036.3.1.2.1.2.7
          key: ubntVendor
          delay: 1d
          value_type: TEXT
          trends: '0'
          description: 'Device Vendor'
          tags:
            - tag: component
              value: system
      tags:
        - tag: class
          value: network
        - tag: target
          value: airos
        - tag: target
          value: ubiquiti
      valuemaps:
        - uuid: 330f01d7f9504fbfb7e35cb1f272871a
          name: status
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
        - uuid: 88b03aeb4ea8492daeb52482b52c8686
          name: statusoper
          mappings:
            - value: '1'
              newvalue: OK
            - value: '2'
              newvalue: down
        - uuid: ed8e5ee655fc4bc783516a7c160c1638
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
  triggers:
    - uuid: f3fb70fc8a8a44e3a858845c16131487
      expression: '(avg(/Ubiquiti Power Beam AC - ISO V2/ifInOctets.5,300s) > 75M) or (avg(/Ubiquiti Power Beam AC - ISO V2/ifOutOctets.5,300s) > 75M)'
      name: 'Eth0 75Mb'
      priority: HIGH
  graphs:
    - uuid: a687dd4ef53c44409a43b112a69c79e6
      name: 'Wlan Traffic'
      graph_items:
        - drawtype: GRADIENT_LINE
          color: 0000EE
          item:
            host: 'Ubiquiti Power Beam AC - ISO V2'
            key: ifInOctets.10
        - sortorder: '1'
          drawtype: GRADIENT_LINE
          color: 00C800
          item:
            host: 'Ubiquiti Power Beam AC - ISO V2'
            key: ifOutOctets.10
