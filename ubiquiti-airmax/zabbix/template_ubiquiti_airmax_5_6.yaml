          key: ubntModel
          delay: 1d
          value_type: TEXT
          trends: '0'
          description: 'Device Model'
          inventory_link: MODEL
          tags:
            - tag: component
              value: system
        - uuid: 2bf66a4096964f97ad90a90d65771de4
          name: 'Station Vendor'
          type: SNMP_AGENT
          snmp_oid: iso.2.840.10036.3.1.2.1.2.7
          key: ubntVendor
          delay: 1d
          value_type: TEXT
          trends: '0'
          description: 'Device Vendor'
          tags:
            - tag: component
              value: system
      tags:
        - tag: class
          value: network
        - tag: target
          value: airos
        - tag: target
          value: ubiquiti
      valuemaps:
        - uuid: 4d6e7aedc34e40328b127d26f4bbc20e
          name: status
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
        - uuid: b014fc6fac0b4b22b34f5da202b3bf68
          name: statusoper
          mappings:
            - value: '1'
              newvalue: OK
            - value: '2'
              newvalue: down
        - uuid: 530620a42e564d7084bd0498dd9007fa
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
  triggers:
