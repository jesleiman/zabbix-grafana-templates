              name: 'AirMax Transmit is less than 216'
              status: DISABLED
              priority: WARNING
              description: 'AirMax Transmit is less than 216'
    - uuid: 5a88c56a82504d5b9703c12c151d04d9
      template: 'Ubiquiti Power Beam AC'
