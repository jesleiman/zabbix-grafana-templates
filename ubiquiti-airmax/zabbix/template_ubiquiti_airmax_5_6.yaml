  templates:
    - uuid: 066016af26444e568b4e1a4392460870
      template: 'Ubiquiti Airmax 5.6'
      name: 'Ubiquiti Airmax 5.6'
      groups:
        - name: Templates/Ubiquiti
      items:
        - uuid: 778a8cc64c724d4f9824108c5cb7e589
          name: 'AirMax Capacity'
          type: SNMP_AGENT
          snmp_oid: 'UBNT-AirMAX-MIB::ubntAirMaxCapacity.1'
          key: ubntAirMaxCapacity.1
          delay: 5m
          history: 90d
          value_type: FLOAT
          tags:
            - tag: Application
              value: 'Wifi Status'
          triggers:
            - uuid: 1b3fa2c61dcf4ed287eebee721393745
              expression: 'last(/Ubiquiti Airmax 5.6/ubntAirMaxCapacity.1)<80'
              name: 'AirMax Capacity 80%'
              status: DISABLED
              priority: WARNING
              description: 'Air Capacity has dropped below 80%'
        - uuid: 17a9bd6c63a2425a8680e80f975fbd2d
          name: 'AirMax Quality'
          type: SNMP_AGENT
          snmp_oid: 'UBNT-AirMAX-MIB::ubntAirMaxQuality.1'
          key: ubntAirMaxQuality.1
          delay: 5m
          history: 90d
