              expression: 'last(/Ubiquiti Airmax 5.6/ubntWlStatRxRate.1)<216'
              name: 'AirMax Receive is less than 216'
              status: DISABLED
              priority: WARNING
              description: 'AirMax Receive is less than 216Mbits'
        - uuid: df3c1f762b524b6a8730cd0f8b856ac1
          name: 'Wireless Signal'
          type: SNMP_AGENT
          snmp_oid: 'UBNT-AirMAX-MIB::ubntWlStatSignal.1'
