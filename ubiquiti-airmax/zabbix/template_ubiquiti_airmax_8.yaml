              newvalue: up
            - value: '2'
              newvalue: down
        - uuid: b014fc6fac0b4b22b34f5da202b3bf68
          name: statusoper
          mappings:
            - value: '1'
              newvalue: OK
            - value: '2'
              newvalue: down
        - uuid: 530620a42e564d7084bd0498dd9007fa
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
