          snmp_oid: 1.3.6.1.4.1.41112.1.4.8.3.0
          key: ubnt.cpu.usage
          delay: 5m
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: cpu
