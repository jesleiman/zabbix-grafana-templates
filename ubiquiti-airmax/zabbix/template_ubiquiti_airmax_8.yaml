          name: 'Free memory'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.10002.1.1.1.1.2.0
          key: ubnt.mem.free
          delay: 5m
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 4c44ad58aff3499487fb25f6589e832e
          name: 'Total memory'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.10002.1.1.1.1.1.0
          key: ubnt.mem.total
          delay: 1d
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: b04ac805ef624e049bb47f9969e8a794
          name: 'Memory utilization'
          type: CALCULATED
          key: ubnt.mem.used.pcent
          delay: 5m
          trends: '0'
          units: '%'
          params: '(last(//ubnt.mem.total) - last(//ubnt.mem.free)) / last(//ubnt.mem.total) * 100'
          tags:
            - tag: component
              value: memory
        - uuid: 237fb9b3274b4c489a3ba42fe7c1964d
          name: 'Firmware Version'
          type: SNMP_AGENT
          snmp_oid: iso.2.840.10036.3.1.2.1.4.7
          key: ubntFirmware
          delay: 1d
          history: 30d
          value_type: TEXT
          trends: '0'
          inventory_link: SOFTWARE
          preprocessing:
            - type: REGEX
              parameters:
                - 'v([0-9]+\.[0-9]+\.[0-9]+)'
                - v\1
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
