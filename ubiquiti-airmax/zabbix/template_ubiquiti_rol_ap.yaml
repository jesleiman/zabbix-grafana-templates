zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a47e4b4a08b2481a80f0db79d008d981
      name: Templates/Ubiquiti
  templates:
    - uuid: fc309467d4ee4cacbdfd4057e590b66c
      template: 'Ubiquiti Rol AP'
      name: 'Ubiquiti Rol AP'
      description: 'Cantidad de Estaciones Conectadas y listar quiénes son los clientes, sus IPs y señales.'
      vendor:
        name: jesleiman
        version: 1.0-1
      groups:
        - name: Templates/Ubiquiti
      items:
        - uuid: f7c6fabb6f8e43e7a5c1716d04f4835e
          name: 'Cantidad de Estaciones Conectadas'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.41112.1.4.5.1.15.1
          key: ubntWlStatStaCount
          delay: 1d
          trends: '0'
          tags:
            - tag: role
              value: base
      discovery_rules:
        - uuid: 7a12e76ac6e1438b81fec8fda1a2511a
          name: 'Descubrimiento de Estaciones Conectadas'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#STA_NAME},.1.3.6.1.4.1.41112.1.4.7.1.2,{#STA_IP},.1.3.6.1.4.1.41112.1.4.7.1.10,{#STA_MAC},.1.3.6.1.4.1.41112.1.4.7.1.1]'
          key: ubnt.stations.discovery
          delay: 6h
          item_prototypes:
            - uuid: 9da2396375ce4eef9af3ba4c314e32f5
              name: 'Estación {#STA_NAME} - IP'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.41112.1.4.7.1.10.{#SNMPINDEX}'
              key: 'ubnt.sta.ip[{#SNMPINDEX}]'
              delay: 1d
              value_type: TEXT
              trends: '0'
              tags:
                - tag: role
                  value: base
                - tag: station
                  value: '{#STA_NAME}'
            - uuid: 8da282d29fd840c9b73e91c002cb32c1
              name: 'Estación {#STA_NAME} - Señal'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.41112.1.4.7.1.3.{#SNMPINDEX}'
              key: 'ubnt.sta.signal[{#SNMPINDEX}]'
              delay: 3m
              value_type: FLOAT
              trends: '0'
              units: dBm
              tags:
                - tag: role
                  value: base
                - tag: station
                  value: '{#STA_NAME}'
              trigger_prototypes:
                - uuid: 246ee6a32fdf47368181e328391bcd02
                  expression: 'avg(/Ubiquiti Rol AP/ubnt.sta.signal[{#SNMPINDEX}],15m)<-80'
                  name: 'Señal degradada en estación {#STA_NAME} ({#STA_IP})'
                  priority: WARNING
            - uuid: 94475bc2408f4063a1e6b2ae8fa6d119
              name: 'Estación {#STA_NAME} - Capacidad TX'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.41112.1.4.7.1.11.{#SNMPINDEX}'
              key: 'ubnt.sta.txcapacity[{#SNMPINDEX}]'
              delay: 3m
              trends: '0'
              units: bps
              tags:
                - tag: role
                  value: base
                - tag: station
                  value: '{#STA_NAME}'
