        - uuid: b1bf10834fa94803af6f0834aab64e36
          name: 'LAN Traffic Outgoing'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.41112.1.6.2.1.1.12.1
          key: unifiIfTxBytes.1
          history: 1w
