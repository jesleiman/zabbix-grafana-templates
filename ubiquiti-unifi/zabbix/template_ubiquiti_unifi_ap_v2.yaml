zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a47e4b4a08b2481a80f0db79d008d981
      name: Templates/Ubiquiti
  templates:
    - uuid: a6a153ced1274209b5b0d81becc7874b
      template: 'Ubiquiti UniFi AP V2'
      name: 'Ubiquiti UniFi AP V2'
      description: |
        ## Description
        
        This template retrieve SNMP data from Unifi AP devices. MIBS requiriments: FROGFOOT-RESOURCES-MIB IANAifType-MIB IF-MIB SNMP-FRAMEWORK-MIB SNMPv2-CONF SNMPv2-MIB SNMPv2-SMI SNMPv2-TC UBNT-MIB UBNT-UniFi-MIB Author: Alex Moura
        
        ## Overview
        
        Explicação detalhada no link do site.  
        Detailed instructions on website link.  
          
        This template retrieve SNMP data from Unifi AP devices.  
          
        Model, Firmware Version, Uptime, IP Address, MAC Address, Interface speed, LAN port Speed and real time traffic, CPU Load, CPU usage, WIFI SSIDs, Traffic/SSID, Users/SSID, AP Hostname, Channel Utilization 2G and 3G,   
          
        Traffic graphics, Users graphics,   
          
        Triggers: CPU Load, Channel usage.  
          
        MIBS requirements:  
        FROGFOOT-RESOURCES-MIB . IANAifType-MIB , IF-MIB , SNMP-FRAMEWORK-MIB , SNMPv2-CONF. SNMPv2-MIB, SNMPv2-SMI, SNMPv2-TC  
        UBNT-MIB, UBNT-UniFi-MIB  
          
        Tested on: (LOCAL and PROXY environments)  
          
        Models tested: UAP, UAP-LR. UAP-LRv2, UAP-AC-LR, UAP-AC-Lite  
          
        (in progress)  
          
        Requirements:  
        AP firmware above 3.9.X  
        AP SNMP feature enabled  
          
         If you Like let a comment to help me make this template better.  
        Se voce gostou deixe um comentário com sugestões para melhoria do template.
        
        
        
        ## Author
        
        Alex Moura
      templates:
        - name: 'Generic by SNMP'
      groups:
        - name: Templates/Ubiquiti
      items:
        - uuid: e3b9b3eb0c9f4a1192cdc4ed03af1e87
          name: 'CPU Utilization'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.25.3.3.1.2.196608
          key: cpuLoad.0
          delay: 5m
          history: 1w
          units: '%'
          tags:
            - tag: component
              value: cpu
        - uuid: 1cea5853cde943ca974ad10daba3d185
          name: 'System Time'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.25.1.2.0
          key: hrSystemDate.0
          delay: 30s
          history: 1d
          value_type: TEXT
          trends: '0'
          tags:
            - tag: Application
              value: System
        - uuid: 069f8bfbcad04c86bcab725200aafd43
          name: 'Load average last 5 minute'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.2021.10.1.3.2
          key: IaLoad.2
          delay: 5m
          history: 1w
          value_type: FLOAT
          tags:
            - tag: component
              value: load
            - tag: component
              value: system
        - uuid: 16df2bd69624433299c9cc5ee0fd8d2a
          name: 'SNMP walk physical interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.2.2.1.5,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.2.2.1.10,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.16,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3]'
          key: net.if.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          tags:
            - tag: component
              value: raw
        - uuid: 438d7b7d9fb840608f164823173c8067
          name: 'SNMP walk UniFi radios'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.41112.1.6.1.1.1.1,1.3.6.1.4.1.41112.1.6.1.1.1.2,1.3.6.1.4.1.41112.1.6.1.1.1.3,1.3.6.1.4.1.41112.1.6.1.1.1.4,1.3.6.1.4.1.41112.1.6.1.1.1.5,1.3.6.1.4.1.41112.1.6.1.1.1.6,1.3.6.1.4.1.41112.1.6.1.1.1.7,1.3.6.1.4.1.41112.1.6.1.1.1.8,1.3.6.1.4.1.41112.1.6.1.1.1.9]'
          key: unifi.radio.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          tags:
            - tag: component
              value: raw
        - uuid: 6227fd6357b342c692a7932046853f45
          name: 'IP Address'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.41112.1.6.3.1.0
          key: unifiApSystemIp.0
          delay: 10m
          history: 1w
          value_type: TEXT
          trends: '0'
          tags:
            - tag: Application
              value: 'AP Interface'
        - uuid: 3c16b85313594ace92f398479399ba21
          name: 'Hardware model'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.41112.1.6.3.3.0
          key: unifiApSystemModel.0
          delay: 60m
          history: 1w
          value_type: TEXT
          trends: '0'
          description: 'Informa o modelo do aparelho'
          inventory_link: MODEL
          tags:
            - tag: component
              value: system
        - uuid: 2f095dd773444d8b9706af85fdd797b0
          name: 'Firmware version'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.41112.1.6.3.6.0
          key: unifiApSystemVersion.0
          delay: 60m
          history: 1w
          value_type: TEXT
          trends: '0'
          inventory_link: SOFTWARE
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 533367fd82354318a4fb829330529aa4
              expression: 'last(/Ubiquiti UniFi AP V2/unifiApSystemVersion.0,#1)<>last(/Ubiquiti UniFi AP V2/unifiApSystemVersion.0,#2) and length(last(/Ubiquiti UniFi AP V2/unifiApSystemVersion.0))>0'
              name: 'UniFi AP: Firmware has changed'
              opdata: 'Current firmware: {ITEM.LASTVALUE1}'
              priority: INFO
              tags:
                - tag: scope
                  value: notice
        - uuid: b542f1ae0310446aa2aa78f11b793539
          name: 'MAC Address'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.41112.1.6.2.1.1.4.1
          key: unifiIfMac.1
          delay: 30m
          history: 1w
          value_type: TEXT
          trends: '0'
          inventory_link: MACADDRESS_A
          tags:
