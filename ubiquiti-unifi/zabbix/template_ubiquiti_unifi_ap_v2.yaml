              name: 'Users {#UNIVAPRADIO} connected on {#UNIFIVAPESSID}'
              show_work_period: 'NO'
              show_triggers: 'NO'
              type: STACKED
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'Ubiquiti UniFi AP V2'
                    key: 'unifiVapNumStations[{#UNIFIVAPESSID},{#UNIVAPRADIO}]'
      tags:
        - tag: class
          value: network
        - tag: target
          value: ubiquiti
        - tag: target
          value: unifi-ap
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'Warning threshold of ICMP packet loss in percent.'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.2'
          description: 'Warning threshold of average ICMP response time in seconds.'
        - macro: '{$IF.DISCARDS.WARN}'
          value: '5'
          description: 'Warning threshold of discarded packets per second. Supports interface-name context.'
        - macro: '{$IF.ERRORS.WARN}'
          value: '0'
          description: 'Warning threshold of errored packets per second. Supports interface-name context.'
        - macro: '{$IF.SPEED.MIN}'
          value: '100000000'
          description: 'Minimum expected physical interface speed in bps. Supports interface-name context.'
        - macro: '{$IFCONTROL}'
          value: '1'
          description: 'Set to 0 to disable link-state alerts. Supports interface-name context.'
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '^eth[0-9]+$'
          description: 'Regular expression selecting physical interfaces for discovery.'
        - macro: '{$RADIO.CHANNEL.UTIL.MAX}'
          value: '80'
          description: 'Maximum channel utilization in percent. Supports radio-band context (ng or na).'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time interval for the SNMP availability trigger.'
      valuemaps:
        - uuid: ec151c7b09144512a965c24ef246d005
          name: 'IF-MIB::ifOperStatus'
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
            - value: '3'
              newvalue: testing
            - value: '4'
              newvalue: unknown
            - value: '5'
              newvalue: dormant
            - value: '6'
              newvalue: notPresent
            - value: '7'
              newvalue: lowerLayerDown
        - uuid: 9996ea6c6b9b437da5f03ecf376315db
          name: 'Service state'
          mappings:
            - value: '2'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: c775ff49bd864419b9a2a71516f2f744
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'not available'
            - value: '1'
              newvalue: available
            - value: '2'
              newvalue: unknown
