              value: 'AP Interface'
        - uuid: 0838921a9e0b46858dd40ee7632c002f
          name: 'LAN Traffic Incoming'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.41112.1.6.2.1.1.6.1
          key: unifiIfRxBytes.1
          history: 1w
          units: Bps
          preprocessing:
            - type: CHANGE_PER_SECOND
