              value: 'AP Interface'
        - uuid: 75de8a9c6c4f49689e950851ee10cb2f
          name: 'LAN Traffic Outgoing Errors'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.41112.1.6.2.1.1.14.1
