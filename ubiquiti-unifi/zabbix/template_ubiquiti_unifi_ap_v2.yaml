          snmp_oid: .1.3.6.1.4.1.41112.1.6.2.1.1.8.1
          key: unifiIfRxError.1
          history: 1w
          units: Error(s)
          tags:
            - tag: Application
              value: 'AP Interface'
        - uuid: fb00d3676afb4415a5e4a6d9e594b1e4
          name: 'Interface Speed (Mbit/s)'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.41112.1.6.2.1.1.11.1
          key: unifiIfSpeed.1
