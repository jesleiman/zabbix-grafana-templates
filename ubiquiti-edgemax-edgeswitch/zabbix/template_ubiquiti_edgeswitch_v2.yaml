zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a47e4b4a08b2481a80f0db79d008d981
      name: Templates/Ubiquiti
  templates:
    - uuid: 745716c964a641ce8f5d5c33225b3fca
      template: 'Ubiquiti EdgeSwitch V2'
      name: 'Ubiquiti EdgeSwitch V2'
      vendor:
        name: jesleiman
        version: 1.0-1      
      templates:
        - name: 'Generic by SNMP'
      groups:
        - name: Templates/Ubiquiti
      items:
        - uuid: 85ed4e373ab8457db03c82ff16e66e49
          name: 'Load average last 1 minute'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.10002.1.1.1.4.2.1.3.1
          key: Load1Minute
          history: 1d
          value_type: FLOAT
          tags:
            - tag: component
              value: load
            - tag: component
              value: system
          triggers:
            - uuid: 7d708d9f0411460b97380ab06fb976a8
              expression: 'last(/Ubiquiti EdgeSwitch SNMP v2/Load1Minute)>{$LOAD_AVG_PER_CPU.MAX.WARN}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Ubiquiti EdgeSwitch SNMP v2/Load1Minute)<{$LOAD_AVG_PER_CPU.MAX.WARN}'
              name: 'Load average is too high (per CPU load over {$LOAD_AVG_PER_CPU.MAX.WARN} for 1m)'
              opdata: 'Load averages(1m): {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Per CPU load average is too high. Your system may be slow to respond.'
              tags:
                - tag: scope
                  value: performance
        - uuid: f4e4143511cf4128ae8d351a73de5589
          name: 'Load average last 5 minute'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.10002.1.1.1.4.2.1.3.2
          key: Load5Minute
          delay: 5m
          history: 1d
          value_type: FLOAT
          description: '5 minute Load'
          tags:
            - tag: component
              value: load
            - tag: component
              value: system
        - uuid: 24d13bf2e039453b889ac868f52fe4d8
          name: 'Total amount of available memory'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.10002.1.1.1.1.2.0
          key: MemAvailable
          history: 7d
          trends: '0'
          units: b
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1000'
          tags:
            - tag: component
              value: memory
            - tag: component
              value: system
        - uuid: 5648c1fcfef84fd78b26853910679789
          name: 'Total amount of memory'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.10002.1.1.1.1.1.0
          key: MemTotal
          history: 7d
          trends: '0'
          units: b
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1000'
          tags:
            - tag: component
              value: memory
            - tag: component
              value: system
        - uuid: f12cd3a2101d4d13b04b17b7119ac2f1
          name: 'Used memory'
          type: CALCULATED
          key: MemUsed
          history: 7d
          trends: '0'
          units: b
          params: last(//MemTotal)-last(//MemAvailable)
          tags:
            - tag: component
              value: memory
            - tag: component
              value: system
        - uuid: 8ddb1ba788104a43aa53115e8cc8881f
          name: 'Firmware Version'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.1.1.0
          key: system.hw.firmware
          delay: 1d
          value_type: TEXT
          trends: '0'
          inventory_link: SOFTWARE
          preprocessing:
            - type: REGEX
              parameters:
                - 'EdgeSwitch [^,]+,\s*([^,]+)'
                - v\1
          tags:
            - tag: component
              value: system
      discovery_rules:
        - uuid: 428d534d36d3471f8f1fb70702297af9
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFNAME},1.3.6.1.2.1.2.2.1.2]'
          key: NetworkInterface
          delay: 1d
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 71effffe9dff4763b5f0b64d5e930267
              name: 'Interface {#IFNAME} : Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}'
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              history: 7d
              trends: '0'
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: 'Interface Speed'
                - tag: component
                  value: network
            - uuid: 813b064e837a4ff3bba6c251a6ba22c8
              name: 'Interface {#IFNAME} : Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}'
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              history: 7d
              trends: '0'
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: 'Interface Speed'
                - tag: component
                  value: network
            - uuid: cbcc5b95ebf745fca93679e2e84dcdfe
              name: 'Interface {#IFNAME} : Speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.5.{#SNMPINDEX}'
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              delay: 1h
              history: 1d
              trends: '0'
              units: bps
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: Application
                  value: 'Interface Speed'
                - tag: component
                  value: network
            - uuid: 48330bf230d3470ba2efcaba765d5de8
              name: 'Interface {#IFNAME} : Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              history: 7d
              trends: '0'
              valuemap:
                name: ifOperStatus
              tags:
                - tag: Application
                  value: 'interface status'
                - tag: component
                  value: network
              trigger_prototypes:
                - uuid: d26dae3ec03b421394c77b6142c9aacb
                  expression: 'last(/Ubiquiti EdgeSwitch SNMP v2/net.if.status[ifOperStatus.{#SNMPINDEX}])<>1'
                  name: 'EdgeMAX: Interface {#IFNAME} is not up (1).'
                  event_name: 'EdgeMAX: Interface {#IFNAME} on {HOST.HOST} status is not up (1).'
                  opdata: 'Interface is currently {ITEM.VALUE1}'
                  status: DISABLED
                  priority: AVERAGE
                  description: 'Interface status is not up (1). Get the interface up again to close the problem automatically.'
                - uuid: e9a6742efe574288a73d09b004bf5cbb
                  expression: 'last(/Ubiquiti EdgeSwitch SNMP v2/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Ubiquiti EdgeSwitch SNMP v2/net.if.status[ifOperStatus.{#SNMPINDEX}],#2) and last(/Ubiquiti EdgeSwitch SNMP v2/net.if.status[ifOperStatus.{#SNMPINDEX}],#2)=1'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Ubiquiti EdgeSwitch SNMP v2/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)=1'
                  name: 'EdgeMAX: Interface {#IFNAME} status has changed'
                  event_name: 'EdgeMAX: Interface {#IFNAME} on {HOST.HOST} status has changed from up (1).'
                  opdata: 'Interface is currently {ITEM.VALUE1}'
                  priority: AVERAGE
                  description: 'Interface status has changed from up (1). Acknowledge to close the problem manually or get the interface up again to close the problem automatically'
                  manual_close: 'YES'
          graph_prototypes:
            - uuid: e914c4fc9ca749aa89105edac4bd2b68
              name: 'Interface {#IFNAME}: Network traffic'
              ymin_type_1: FIXED
              graph_items:
                - color: F63100
                  calc_fnc: ALL
                  item:
                    host: 'Ubiquiti EdgeSwitch SNMP v2'
                    key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
                - sortorder: '1'
                  color: 199C0D
                  calc_fnc: ALL
                  item:
                    host: 'Ubiquiti EdgeSwitch SNMP v2'
                    key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
      tags:
        - tag: class
          value: network
        - tag: target
          value: EdgeSwitch
        - tag: target
          value: ubiquiti
      macros:
        - macro: '{$LOAD_AVG_PER_CPU.MAX.WARN}'
          value: '85'
          description: 'This macro is used as a threshold in memory utilization trigger.'
        - macro: '{$MEMORY.UTIL.MAX}'
          value: '90'
          description: 'This macro is used as a threshold in memory utilization trigger.'
      valuemaps:
        - uuid: 945de494106243fb8c3142460b77271a
          name: ifOperStatus
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
            - value: '3'
              newvalue: testing
            - value: '4'
              newvalue: unknown
            - value: '5'
              newvalue: dormant
            - value: '6'
              newvalue: notPresent
            - value: '7'
              newvalue: lowerLayerDow
