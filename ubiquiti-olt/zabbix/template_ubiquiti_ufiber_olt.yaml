zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a47e4b4a08b2481a80f0db79d008d981
      name: Templates/Ubiquiti
  templates:
    - uuid: ad9bf42efc074b30a69aaefd537e9ef5
      template: 'Ubiquiti OLT 4-8 V2'
      name: 'Ubiquiti OLT 4-8 V2'
      description: 'Unifi Fiber OLT'
      vendor:
        name: jesleiman
        version: 1.0-1      
      templates:
        - name: 'Generic by SNMP'
      groups:
        - name: Templates/Ubiquiti
      items:
        - uuid: b2bd306343bc4b4e9f00ccf03b57ec78
          name: 'System Model'
          type: SNMP_AGENT
          snmp_oid: 'UBNT-UFIBER-MIB::ubntModel.0'
          key: UbntModel
          delay: 1d
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'System Model'
          inventory_link: MODEL
          tags:
            - tag: component
              value: system
        - uuid: 0636f0ce7a9f49dd8b75e1eeb2656f7c
          name: 'Serial Number'
          type: SNMP_AGENT
          snmp_oid: 'UBNT-UFIBER-MIB::ubntSerialNumber.0'
          key: UbntSerialNumber
          delay: 1d
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'Serial Number'
          inventory_link: CHASSIS
          tags:
            - tag: component
              value: system
        - uuid: dc580eb9078240468ce942ad78f786b8
          name: 'Firmware Version'
          type: SNMP_AGENT
          snmp_oid: 'UBNT-UFIBER-MIB::ubntVersion.0'
          key: UbntVersion
          delay: 1d
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'System version'
          inventory_link: SOFTWARE
          preprocessing:
            - type: REGEX
              parameters:
                - 'v([0-9]+\.[0-9]+\.[0-9]+)'
                - v\1
          tags:
            - tag: component
              value: system
      discovery_rules:
        - uuid: 518716a1193e487faeee71f3a68cd97b
          name: 'SFP Interfaces'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME}, 1.3.6.1.2.1.2.2.1.2, {#IFOPERSTATUS}, 1.3.6.1.2.1.2.2.1.8]'
          key: net.if.discovery.custom
          delay: 1d
          filter:
            conditions:
              - macro: '{#IFNAME}'
                value: ^sfp
                formulaid: A
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: ede2a27be12f4f05a771db2bd67afbdf
              name: 'Interface {#IFNAME}: Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}'
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: SPF+
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: e449bf3f21184c18aa5e14c232970e9e
              name: 'Interface {#IFNAME}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}'
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              value_type: FLOAT
              trends: '0'
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: SPF+
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: cd5b2630a8d5431f966f325f992a1986
              name: 'Interface {#IFNAME}: Speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.5.{#SNMPINDEX}'
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              delay: 15m
              value_type: FLOAT
              trends: '0'
              units: bps
              preprocessing:
                - type: STR_REPLACE
                  parameters:
                    - '4294967295'
                    - '10000000000'
              tags:
                - tag: Application
                  value: SPF+
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 1552f05a22b2475f9ada3ae48d5c18ac
              name: 'Interface {#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              trends: '0'
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: Application
                  value: SPF+
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: fc6f7ba4af814afaae9a37f4f61d23fe
                  expression: 'last(/Ubiquiti OLT 4-8 V2/net.if.status[ifOperStatus.{#SNMPINDEX}])=2'
                  name: 'Interface {#IFNAME}: Link down'
                  status: DISABLED
                  discover: NO_DISCOVER
                  priority: HIGH
                  manual_close: 'YES'
        - uuid: 203c16f0a58b41dfba70c06b68fe4802
          name: FAN
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE}, 1.3.6.1.4.1.41112.1.5.5.2.1.1]'
          key: ubnt.fan.discovery
          delay: 1d
          item_prototypes:
            - uuid: 9b4d345d4c0d49e2a39801b51d5a46dd
              name: 'Speed: FAN {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.41112.1.5.5.2.1.3.{#SNMPINDEX}'
              key: 'ubntFanSpeed[{#SNMPINDEX}]'
              delay: 15m
              value_type: FLOAT
              trends: '0'
              units: rpm
              tags:
                - tag: component
                  value: temperature
                - tag: fan
                  value: '{#SNMPINDEX}'
              trigger_prototypes:
                - uuid: ce4559fc8a924d4991a45e80f18d390e
                  expression: 'last(/Ubiquiti OLT 4-8 V2/ubntFanSpeed[{#SNMPINDEX}])<1000'
                  name: 'The fan FAN {#SNMPINDEX} on {HOST.NAME} has stopped or is failing'
                  priority: HIGH
                  manual_close: 'YES'
        - uuid: a49f8e88bb70494bbef08b9cd1a3186f
          name: PSU
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PSUIDX}, 1.3.6.1.4.1.41112.1.5.3.2.1.1]'
          key: ubnt.power.discovery
          delay: 1d
          item_prototypes:
            - uuid: 625a596d2e994793b4c510aee6d358db
              name: 'Operational Status: PSU {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.41112.1.5.3.2.1.4.{#SNMPINDEX}'
              key: 'ubntPsuOperStatus[{#SNMPINDEX}]'
              delay: 30m
              trends: '0'
              valuemap:
                name: 'PSU Oper Status'
              tags:
                - tag: component
                  value: psu
                - tag: psu
                  value: '{#SNMPINDEX}'
            - uuid: 421fa7f08ff4404a9b556d81ebc71da2
              name: 'Source Status: PSU {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.41112.1.5.3.2.1.3.{#SNMPINDEX}'
              key: 'ubntPsuStatus[{#SNMPINDEX}]'
              delay: 30m
              trends: '0'
              valuemap:
                name: 'PSU Status'
              tags:
                - tag: component
                  value: psu
                - tag: psu
                  value: '{#SNMPINDEX}'
              trigger_prototypes:
                - uuid: cc0b11c0662c47aa907196659a2c5173
                  expression: 'last(/Ubiquiti OLT 4-8 V2/ubntPsuStatus[{#SNMPINDEX}])<>1'
                  name: 'Problem with Power Supply PSU {#SNMPINDEX} on {HOST.NAME}'
                  priority: AVERAGE
                  manual_close: 'YES'
        - uuid: 7305f566e8614f4f814709cc072ed46b
          name: Thermometers
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#THERM_TYPE}, UBNT-UFIBER-MIB::ubntThermType, {#THERM_TEMP}, UBNT-UFIBER-MIB::ubntThermTemperature]'
          key: ubnt.thermometers.discovery
          delay: 1d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 70883402e32c4939a9cc403afcf4c754
              name: 'Sensor Temperature: {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: 'UBNT-UFIBER-MIB::ubntThermTemperature.{#SNMPINDEX}'
              key: 'ubntThermTemperature[{#SNMPINDEX}]'
              delay: 15m
              value_type: FLOAT
              units: °C
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              tags:
                - tag: component
                  value: temperature
                - tag: 'sensor temp'
                  value: '{#SNMPINDEX}'
              trigger_prototypes:
                - uuid: b83404a72f8d4ee8808d6ed9ed1cceb9
                  expression: 'last(/Ubiquiti OLT 4-8 V2/ubntThermTemperature[{#SNMPINDEX}]) > 75'
                  name: 'High temperature on sensor {#SNMPINDEX} on {HOST.NAME}'
                  opdata: 'Current value: {ITEM.LASTVALUE}'
                  manual_close: 'YES'
        - uuid: d388d62fc78c4e64b704eda952c776f8
          name: 'ONT devices'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},UBNT-UFIBER-MIB::ubntOnuName]'
          key: ubntOnuSN
          delay: 1h
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 201f191e8ec24208a50fc071b3f9ac41
              name: 'ONU: {#SNMPVALUE} - Time Connected'
              type: SNMP_AGENT
              snmp_oid: 'UBNT-UFIBER-MIB::ubntOnuConnectedTime.{#SNMPINDEX}'
              key: 'ubntOnuConnectedTime2.[{#SNMPINDEX}]'
              delay: 15m
              history: 90d
              value_type: FLOAT
              units: uptime
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.01'
              tags:
                - tag: Application
                  value: ONT
                - tag: component
                  value: network
                - tag: interface
                  value: 'ONT {#SNMPVALUE}'
            - uuid: 288475ab6fc34730bd331790d09f86f2
              name: 'ONU: {#SNMPVALUE} - OLT Port'
              type: SNMP_AGENT
              snmp_oid: 'UBNT-UFIBER-MIB::ubntOnuOltPort.{#SNMPINDEX}'
              key: 'ubntOnuOltPort.[{#SNMPINDEX}]'
              delay: 1d
              history: 90d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: REGEX
                  parameters:
                    - '([0-9]+)'
                    - pon\1
              tags:
                - tag: Application
                  value: ONT
                - tag: component
                  value: network
                - tag: interface
                  value: 'ONT {#SNMPVALUE}'
            - uuid: fa353facea2d4fb28849b4b79e5752e3
              name: 'ONU: {#SNMPVALUE} - Online'
              type: SNMP_AGENT
              snmp_oid: 'UBNT-UFIBER-MIB::ubntOnuOnline.{#SNMPINDEX}'
              key: 'UbntOnuOnline.[{#SNMPINDEX}]'
              delay: 5m
              history: 90d
              value_type: CHAR
              trends: '0'
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: Application
                  value: ONT
                - tag: component
                  value: network
                - tag: interface
                  value: 'ONT {#SNMPVALUE}'
              trigger_prototypes:
                - uuid: 8ab34fe8330a431791091d25a2dbccae
                  expression: 'last(/Ubiquiti OLT 4-8 V2/UbntOnuOnline.[{#SNMPINDEX}])<>1'
                  name: 'ONU {#SNMPVALUE} Down'
                  priority: AVERAGE
                  dependencies:
                    - name: 'No disponible mediante ping ICMP'
                      expression: 'max(/Ubiquiti OLT 4-8 V2/icmpping,#5)=0'
                      recovery_expression: 'min(/Ubiquiti OLT 4-8 V2/icmpping,#3)=1'
            - uuid: 9f8626b790524681bb3b55c53c04ef70
              name: 'ONU: {#SNMPVALUE} - Bytes Rx (Upload)'
              type: SNMP_AGENT
              snmp_oid: 'UBNT-UFIBER-MIB::ubntOnuRxBytes.{#SNMPINDEX}'
              key: 'ubntOnuRxBytes.[{#SNMPINDEX}]'
              delay: 5m
              history: 90d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: ONT
                - tag: component
                  value: network
                - tag: interface
                  value: 'ONT {#SNMPVALUE}'
            - uuid: ccdc836e2d554910b8bad1ef38af099a
              name: 'ONU: {#SNMPVALUE} - Power Rx'
              type: SNMP_AGENT
              snmp_oid: 'UBNT-UFIBER-MIB::ubntOnuRxPower.{#SNMPINDEX}'
              key: 'UbntOnuRxPower.[{#SNMPINDEX}]'
              delay: 5m
              history: 90d
              value_type: FLOAT
              units: dBm
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.01'
              tags:
                - tag: Application
                  value: ONT
                - tag: component
                  value: network
                - tag: interface
                  value: 'ONT {#SNMPVALUE}'
            - uuid: b21906fb6824473fb2b92742a03ed228
              name: 'ONU: {#SNMPVALUE} - Bytes Tx (Download)'
              type: SNMP_AGENT
              snmp_oid: 'UBNT-UFIBER-MIB::ubntOnuTxBytes.{#SNMPINDEX}'
              key: 'ubntOnuTxBytes.[{#SNMPINDEX}]'
              delay: 5m
              history: 90d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: ONT
                - tag: component
                  value: network
                - tag: interface
                  value: 'ONT {#SNMPVALUE}'
            - uuid: 69885fba787b4ce6a345003b6f81ae28
              name: 'ONU: {#SNMPVALUE} - Power Tx'
              type: SNMP_AGENT
              snmp_oid: 'UBNT-UFIBER-MIB::ubntOnuTxPower.{#SNMPINDEX}'
              key: 'ubntOnuTxPower.[{#SNMPINDEX}]'
              delay: 5m
              history: 90d
              units: dBm
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.01'
              tags:
                - tag: Application
                  value: ONT
                - tag: component
                  value: network
                - tag: interface
                  value: 'ONT {#SNMPVALUE}'
        - uuid: 782ff4226c4d4c3594c726f137ee0fc4
          name: 'PON Interfaces'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME}, 1.3.6.1.2.1.2.2.1.2, {#IFOPERSTATUS}, 1.3.6.1.2.1.2.2.1.8]'
          key: ubntSfpIndex
          delay: 1d
          filter:
            conditions:
              - macro: '{#IFNAME}'
                value: ^pon
                formulaid: A
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: b51ef1e9ce02401a83b74d0a4e77b8fb
              name: 'Interface {#IFNAME}: Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}'
              key: 'net.pon.in[ifHCInOctets.{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: PON
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: e44c861cf9e84ae0839dbd34e57724a8
              name: 'Interface {#IFNAME}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}'
              key: 'net.pon.out[ifHCOutOctets.{#SNMPINDEX}]'
              delay: 3m
              history: 90d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: Application
                  value: PON
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: d6e8300af52842d7b675c65149aa39d9
              name: 'Interface {#IFNAME}: ONTs connected'
              type: CALCULATED
              key: 'onu.count.[{#SNMPINDEX}]'
              delay: 30m
              history: 15d
              trends: '0'
              params: 'count(last_foreach(//ubntOnuOltPort.[*]),"eq","{#IFNAME}")'
              tags:
                - tag: Application
                  value: PON
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: 2a039671472f44a5b62039d915bec4d5
                  expression: 'last(/Ubiquiti OLT 4-8 V2/onu.count.[{#SNMPINDEX}])>{$ONT.HIGH.MAX}'
                  name: 'Port {#IFNAME}: Critical capacity of connected ONTs (>100 out of 125)'
                  priority: HIGH
                - uuid: 59d7910fbde64658b40fc1aac485369f
                  expression: 'last(/Ubiquiti OLT 4-8 V2/onu.count.[{#SNMPINDEX}])>{$ONT.WARN.MAX}'
                  name: 'Port {#IFNAME}: High density of connected ONTs (>80)'
                  priority: WARNING
                  dependencies:
                    - name: 'Port {#IFNAME}: Critical capacity of connected ONTs (>100 out of 125)'
                      expression: 'last(/Ubiquiti OLT 4-8 V2/onu.count.[{#SNMPINDEX}])>{$ONT.HIGH.MAX}'
            - uuid: 14b42483edac458a8fbe480b8ae75200
              name: 'Interface {#IFNAME} operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'ubntSfpUp.[{#SNMPINDEX}]'
              history: 90d
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: Application
                  value: PON
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 5bb5c526335d45c8bfdd13367ddf6220
              name: 'Interface {#IFNAME} vendor'
              type: SNMP_AGENT
              snmp_oid: 'UBNT-UFIBER-MIB::ubntSfpVendor.{#SNMPINDEX}'
              key: 'ubntSfpVendor.[{#SNMPINDEX}]'
              delay: 1d
              history: 90d
              value_type: CHAR
              trends: '0'
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: Application
                  value: PON
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
      tags:
        - tag: class
          value: network
        - tag: target
          value: OLT
        - tag: target
          value: ubiquiti
      macros:
        - macro: '{$ONT.HIGH.MAX}'
          value: '100'
        - macro: '{$ONT.WARN.MAX}'
          value: '80'
        - macro: '{$PUERTOS.PON.MAX}'
          value: '8'
          description: 'Change depending on the number of ports the OLT has.'
      valuemaps:
        - uuid: 2f7a9b8e7f304f629f888e1b52018b31
          name: 'IF-MIB::ifOperStatus'
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
            - value: '3'
              newvalue: testing
            - value: '4'
              newvalue: unknown
            - value: '5'
              newvalue: dormant
            - value: '6'
              newvalue: notPresent
            - value: '7'
              newvalue: lowerLayerDown
        - uuid: e18b335faecf4cab8a4bcc1a69048229
          name: 'PSU Oper Status'
          mappings:
            - value: '0'
              newvalue: Normal
            - value: '1'
              newvalue: 'Power Failure'
        - uuid: 1997312840f34d5e8f7edc2184f78eae
          name: 'PSU Status'
          mappings:
            - value: '1'
              newvalue: OK
            - value: '2'
              newvalue: Failure
            - value: '3'
              newvalue: 'Not Present'
  triggers:
    - uuid: c46e005699a24922aceeec9dc1526ddb
      expression: '(last(/Ubiquiti OLT 4-8 V2/system.hw.uptime[hrSystemUptime.0])>0 and last(/Ubiquiti OLT 4-8 V2/system.hw.uptime[hrSystemUptime.0])<10m) or (last(/Ubiquiti OLT 4-8 V2/system.hw.uptime[hrSystemUptime.0])=0 and last(/Ubiquiti OLT 4-8 V2/system.net.uptime[sysUpTime.0])<10m)'
      name: 'Network Generic Device: Host has been restarted'
      event_name: 'Network Generic Device: {HOST.NAME} has been restarted (uptime < 10m)'
      priority: WARNING
      description: 'Uptime is less than 10 minutes.'
      manual_close: 'YES'
      tags:
        - tag: scope
          value: notice
